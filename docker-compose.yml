version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: egov-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./shared/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./shared/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - egov-net

  rest-service:
    build:
      context: .
      dockerfile: services/rest-service/Dockerfile
    container_name: egov-rest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: ${REST_PORT}
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: ${POSTGRES_USER}
      PG_PASSWORD: ${POSTGRES_PASSWORD}
      PG_DATABASE: ${POSTGRES_DB}
    ports:
      - "${REST_PORT}:${REST_PORT}"
    networks:
      - egov-net

  grpc-service:
    build:
      context: .
      dockerfile: services/grpc-service/Dockerfile
    container_name: egov-grpc
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: ${GRPC_PORT}
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: ${POSTGRES_USER}
      PG_PASSWORD: ${POSTGRES_PASSWORD}
      PG_DATABASE: ${POSTGRES_DB}
    ports:
      - "${GRPC_PORT}:${GRPC_PORT}"
    networks:
      - egov-net

  graphql-service:
    build:
      context: .
      dockerfile: services/graphql-service/Dockerfile
    container_name: egov-graphql
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: ${GRAPHQL_PORT}
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: ${POSTGRES_USER}
      PG_PASSWORD: ${POSTGRES_PASSWORD}
      PG_DATABASE: ${POSTGRES_DB}
    ports:
      - "${GRAPHQL_PORT}:${GRAPHQL_PORT}"
    networks:
      - egov-net

networks:
  egov-net:
    driver: bridge

volumes:
  pgdata: